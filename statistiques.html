<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAMA+ – Statistiques et Performance</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header role="banner" class="tools-header">
      <div class="header-left">
        <a href="index-professionnel.html" style="color: #fff; text-decoration: none; font-size: 1.5rem; margin-right: 1rem;">←</a>
        <span class="header-icon">📈</span>
        <h1>MAMA+ – Statistiques et Performance</h1>
      </div>
      <div id="auth-section" role="navigation">
        <div id="user-info" class="hidden" aria-live="polite">
          <span id="user-name" aria-label="Nom de l'utilisateur"></span>
          <button id="logout-button" type="button" aria-label="Se déconnecter">Déconnexion</button>
        </div>
      </div>
    </header>

    <main role="main" style="padding: 2rem;">
      <!-- Onglets pour basculer entre Statistiques et Performance -->
      <div class="tabs-container" style="margin-bottom: 1.5rem;">
        <button class="tab-btn active" id="tab-stats" onclick="switchTab('stats')">
          📈 Statistiques
        </button>
        <button class="tab-btn" id="tab-performance" onclick="switchTab('performance')">
          📊 Performance
        </button>
      </div>

      <!-- Section Statistiques -->
      <section class="card tab-content active" id="stats-section" aria-live="polite" aria-label="Statistiques du tableau de bord">
        <div class="card-header-with-icon">
          <span class="card-icon">📈</span>
          <h2>Statistiques - Graphiques et tendances</h2>
        </div>
        <div id="stats-content" style="padding: 1rem;">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Chargement des statistiques...</p>
          </div>
        </div>
      </section>

      <!-- Section Performance -->
      <section class="card tab-content" id="performance-section" aria-live="polite" aria-label="Statistiques de performance">
        <div class="card-header-with-icon">
          <span class="card-icon">📊</span>
          <h2>Statistiques de performance</h2>
        </div>
        <div id="performance-content" style="padding: 1rem;">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Chargement des statistiques de performance...</p>
          </div>
        </div>
      </section>
    </main>

    <footer role="contentinfo">
      <small>Prototype MAMA+ – Amélioration du suivi prénatal</small>
    </footer>

    <!-- Version simplifiée - Fonctionne sans serveur backend -->
    <script src="app-professionnel-simple.js" defer></script>
    <script>
      // Fonction pour basculer entre les onglets
      function switchTab(tabName) {
        // Désactiver tous les onglets
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.remove('active');
        });
        document.querySelectorAll('.tab-content').forEach(content => {
          content.classList.remove('active');
        });
        
        // Activer l'onglet sélectionné
        const tabBtn = document.getElementById(`tab-${tabName}`);
        const tabContent = document.getElementById(`${tabName}-section`);
        
        if (tabBtn) {
          tabBtn.classList.add('active');
        }
        if (tabContent) {
          tabContent.classList.add('active');
        }
      }
      
      // Vérifier si on arrive depuis la page performance (via hash)
      document.addEventListener("DOMContentLoaded", () => {
        // Vérifier l'URL pour voir si on doit afficher l'onglet performance
        if (window.location.hash === '#performance') {
          switchTab('performance');
        }
        
        // Charger les statistiques
        if (window.renderStatsPage) {
          window.renderStatsPage();
        }
        if (window.renderPerformancePage) {
          window.renderPerformancePage();
        }
      });
    </script>
  </body>
</html>
