<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>MAMA+ – Alertes prioritaires</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles-icons.css" />
    <link rel="stylesheet" href="styles-mobile-nav.css" />
  </head>
  <body>
    <header role="banner" class="tools-header">
      <div class="header-left">
        <a href="index-professionnel.html" style="color: #fff; text-decoration: none; font-size: 1.5rem; margin-right: 1rem;">←</a>
        <span class="header-icon">⚠️</span>
        <h1>MAMA+ – Alertes prioritaires</h1>
      </div>
      <div id="auth-section" role="navigation">
        <div id="user-info" class="hidden" aria-live="polite">
          <span id="user-name" aria-label="Nom de l'utilisateur"></span>
          <button id="logout-button" type="button" aria-label="Se déconnecter">Déconnexion</button>
        </div>
      </div>
    </header>

    <main role="main" style="padding: 2rem;">
      <section class="card alerts-card" id="alerts-card">
        <div class="card-header-with-icon">
          <span class="card-icon" style="font-size: 2rem;">⚠️</span>
          <h2>Alertes prioritaires</h2>
        </div>
        <div id="alertes-prioritaires-content" style="padding: 1rem;">
          <div class="loading-state" style="text-align: center; padding: 2rem; color: #6b7280;">
            <p>Chargement des alertes...</p>
          </div>
        </div>
      </section>
    </main>

    <footer role="contentinfo">
      <small>Prototype MAMA+ – Amélioration du suivi prénatal</small>
    </footer>

    <!-- Script pour les alertes prioritaires (version simplifiée) -->
    <!-- Navigation mobile -->
    <script src="utils/icons.js"></script>
    <script src="utils/mobile-nav.js" defer></script>
    <script src="app-alertes-simple.js" defer></script>
  </body>
</html>
